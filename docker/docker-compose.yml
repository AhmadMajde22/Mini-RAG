services:
  # FastAPI Application

  fastapi:
    build:
      context: ..
      dockerfile: docker/minirag/Dockerfile
    container_name: fastapi
    ports:
      - "8000:8000"
    networks:
      - backend
    volumes:
      - fastapi_data:/app/assets
    restart: always
    depends_on:
      pgvector:
        condition: service_healthy
    env_file:
      - ./env/.env.app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  celery-worker:
    build:
      context: ..
      dockerfile: docker/minirag/Dockerfile
    container_name: celery-worker
    entrypoint: ["python", "-m", "celery", "-A", "celery_app"]
    command: ["worker", "--queues=default,mail_server_queue,file_processing,data_indexing,maintenance", "--loglevel=info", "--events"]
    env_file:
      - ./env/.env.app
    volumes:
      - fastapi_data:/app/assets
    networks:
      - backend
    depends_on:
      fastapi:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  celery-beat:
    build:
      context: ..
      dockerfile: docker/minirag/Dockerfile
    container_name: celery-beat
    entrypoint: ["python", "-m", "celery", "-A", "celery_app"]
    command: ["beat", "--loglevel=info", "--schedule=/var/lib/celery/celerybeat-schedule"]
    env_file:
      - ./env/.env.app
    volumes:
      - celery_beat_data:/var/lib/celery
    networks:
      - backend
    depends_on:
      rabbitmq:
        condition: service_healthy
      celery-worker:
        condition: service_started
    restart: always

  flower:
    build:
      context: ..
      dockerfile: docker/minirag/Dockerfile
    container_name: flower
    entrypoint: ["python", "-m", "celery", "-A", "celery_app"]
    command: ["flower", "--conf=flowerconfig.py", "--port=5555"]
    ports:
      - "5555:5555"
    env_file:
      - ./env/.env.app
    networks:
      - backend
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # Nginx Service

  nginx:
    image: nginx:stable-alpine3.24
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - fastapi
    networks:
      - backend
    restart: always

  # PostgreSQL

  pgvector:
    image: pgvector/pgvector:0.8.5-pg18-trixie
    container_name: pgvector
    ports:
      - "5445:5432"
    volumes:
      - "pgvector:/var/lib/postgresql"
    env_file:
      - ./env/.env.postgres
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Qdrant

  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - backend
    restart: always

  # Prometheus

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"

    networks:
      - backend
    restart: always

  # Grafana
  grafana:
    image: grafana/grafana:13.0.4-ubuntu
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    env_file:
      - ./env/.env.grafana
    depends_on:
      - prometheus
    networks:
      - backend
    restart: always

  # Node Exporter

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)"

  # PostgreSQL Exporter

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres-exporter
    ports:
      - "9187:9187"
    env_file:
      - ./env/.env.postgres-exporter
    depends_on:
      - pgvector
    networks:
      - backend
    restart: always

  rabbitmq:
    image: rabbitmq:4.2.9-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    env_file:
      - ./env/.env.rabbitmq
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      timeout: 10s
      retries: 5

  redis:
    image: redis:alpine3.23
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    env_file:
      - ./env/.env.redis
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 10s
      retries: 5
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:-minirag_redis_2222}",
      ]

networks:
  backend:
    driver: bridge

volumes:
  pgvector:
  qdrant_data:
  prometheus_data:
  grafana_data:
  fastapi_data:
  rabbitmq_data:
  redis_data:
  celery_beat_data:
